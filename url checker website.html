<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <title> URL Checker</title>
</head>
<body>
<h2> FAKE URL CHECKER</h2>
<input type="text" id="url" placeholder="Enter URL">
<button onclick="checkURL()">Check</button>

<p id="result"></p>

<script>
function checkURL() {
    let url = document.getElementById("url").value;
    let count = 0;

    // IP address in URL
    if (/http[s]?:\/\/\d+\.\d+\.\d+\.\d+.*/.test(url)) {
        count++;
    }

    // Too many dots
    if (url.split(".").length > 3) {
        count++;
    }

    let result = document.getElementById("result");

    if (count >= 2) {
        result.innerHTML = "URL Detected is fake";
        result.style.color = "red";
    } else {
        result.innerHTML = "URL is Safe";
        result.style.color = "green";
    }
}
</script>

</body>
</html>
